<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>toys</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
    background: #fdf6ec;
    color: #4a3b2f;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { max-width: 560px; width: 100%; }
  h1 { font-size: 28px; margin-bottom: 18px; }
  a.card {
    display: block;
    background: #fff;
    border-radius: 18px;
    padding: 22px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 4px 14px rgba(0,0,0,.10);
    transition: transform .12s;
  }
  a.card:hover { transform: translateY(-3px); }
  .card h2 { font-size: 22px; margin-bottom: 8px; }
  .card p { font-size: 14px; color: #8a7561; line-height: 1.7; }
</style>
</head>
<body>
<main>
  <h1>🧸 toys</h1>
  <a class="card" href="little-planet/">
    <h2>🪐 おえかきプラネット</h2>
    <p>紙に描いた絵をスキャンすると、海・陸・空のワールドで動きだす。
       ぬりえシートを印刷して、色を塗って、カメラで読み込もう。
       にんげんは歩いて、タップするとダンスするよ。</p>
  </a>
</main>
</body>
</html>
